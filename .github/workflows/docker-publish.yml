name: Build and Publish Docker Images

on:
  push:
    branches:
      - develop
    tags:
      - "v*.*.*"

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      version: ${{ steps.resolve-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Discover Dockerfiles
        id: set-matrix
        run: |
          services=$(ls build/*.Dockerfile \
            | sed 's|build/||; s|\.Dockerfile||' \
            | jq -Rc . | jq -sc '{service: .}')
          echo "matrix=$services" >> $GITHUB_OUTPUT

      - name: Resolve version
        id: resolve-version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            # 正式发布：直接用 tag 名
            VERSION="${GITHUB_REF_NAME}"
          else
            # develop 测试包：base = 最近 semver tag，拼 run_number
            BASE=$(git tag --list 'v*.*.*' --sort=-version:refname | head -1)
            if [[ -z "$BASE" ]]; then
              BASE="v0.0.0"
            fi
            VERSION="${BASE}.${{ github.run_number }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Resolved version: $VERSION"

  build-and-push:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build tags
        id: tags
        run: |
          IMAGE="${{ env.IMAGE_PREFIX }}/ran-feed-${{ matrix.service }}"
          VERSION="${{ needs.prepare.outputs.version }}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            # 正式包：版本 tag + latest
            echo "tags=${IMAGE}:${VERSION},${IMAGE}:latest" >> $GITHUB_OUTPUT
          else
            # 测试包：仅版本 tag，不覆盖 latest
            echo "tags=${IMAGE}:${VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: build/${{ matrix.service }}.Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
