version: "2"

linters:
  default: none
  enable:
    - errcheck
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
    - nilerr
  settings:
    errcheck:
      exclude-functions:
        - "(io.Closer).Close"
  exclusions:
    rules:
      - linters: [staticcheck]
        text: SA5008