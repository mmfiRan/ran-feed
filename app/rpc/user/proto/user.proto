syntax = "proto3";

package ranfeed.user;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "pkg/commonpb/common.proto";

option go_package = "ran-feed/app/rpc/user/user";

// 性别
enum Gender {
  GENDER_UNSPECIFIED = 0; // 未知
  GENDER_MALE = 1; // 男
  GENDER_FEMALE = 2; // 女
}

// 用户状态
enum UserStatus {
  USER_STATUS_UNSPECIFIED = 0; // 未知
  USER_STATUS_ACTIVE = 10; // 正常
  USER_STATUS_DISABLED = 20; // 禁用
  USER_STATUS_CANCELLED = 30; // 注销
}

// 用户基础信息
message UserInfo {
  int64 user_id = 1;
  string username = 2;
  string mobile = 3;
  string nickname = 4;
  string avatar = 5;
  string bio = 6;
  ranfeed.commonpb.EnumValue gender = 7;
  ranfeed.commonpb.EnumValue status = 8;
}

// 用户主页资料
message UserProfile {
  int64 user_id = 1;
  string nickname = 2;
  string avatar = 3;
  string bio = 4;
  ranfeed.commonpb.EnumValue gender = 5;
  ranfeed.commonpb.EnumValue status = 6;
}

// 注册请求
message RegisterReq {
  string mobile = 1;
  string password = 2;
  string nickname = 3;
  string avatar = 4;
  optional string bio = 5;
  string email = 6;
  Gender gender = 7;
  google.protobuf.Timestamp birthday = 8;
}

// 注册响应
message RegisterRes {
  int64 user_id = 1;
  string token = 2;
  google.protobuf.Timestamp expired_at = 3; // 过期时间
}

// 登录请求
message LoginReq {
  string mobile = 1;
  string password = 2;
}

// 登录响应
message LoginRes {
  int64 user_id = 1;
  string token = 2;
  google.protobuf.Timestamp expired_at = 3; // 过期时间
  string nickname = 4;
  string avatar = 5;
}

// 退出登录请求
message LogoutReq {
  int64 user_id = 1;
  string token = 2;
}

// 获取当前用户信息请求
message GetMeReq {
  int64 user_id = 1;
}

// 获取当前用户信息响应
message GetMeRes {
  UserInfo user_info = 1;
  int64 followee_count = 2;
  int64 follower_count = 3;
  int64 like_received_count = 4;
  int64 favorite_received_count = 5;
}

// 按 user_id 查询单个用户请求
message GetUserReq {
  int64 user_id = 1;
}

// 按 user_id 查询单个用户响应
message GetUserRes {
  UserInfo user_info = 1;
}

// 查询用户主页资料请求
message GetUserProfileReq {
  int64 user_id = 1;
}

// 查询用户主页资料响应
message GetUserProfileRes {
  UserProfile user_profile = 1;
}

// 批量查询用户信息请求
message BatchGetUserReq {
  repeated int64 user_ids = 1;
}

// 批量查询用户信息响应
message BatchGetUserRes {
  repeated UserInfo users = 1;
}

// UserIndexItem 搜索建索引用的原始字段投影 只在可索引(正常+未删除)时返回
message UserIndexItem {
  int64 user_id = 1;
  string nickname = 2;
  string bio = 3;
  string username = 4;
  UserStatus status = 5;   // 恒为正常 带上供 search 纯拷贝写入
  int64 version = 6;       // user.updated_at 毫秒 供全量重建 ES external version
}

// BatchGetUserForIndexReq 增量回源 按 user_id 批量取索引投影
message BatchGetUserForIndexReq {
  repeated int64 user_ids = 1;
}

// BatchGetUserForIndexRes 增量回源响应
message BatchGetUserForIndexRes {
  repeated UserIndexItem items = 1;
}

// ListUserForIndexReq 全量重建 按 id keyset 游标扫可索引用户
message ListUserForIndexReq {
  int64 cursor = 1;
  int32 limit = 2;
}

// ListUserForIndexRes 全量重建响应
message ListUserForIndexRes {
  repeated UserIndexItem items = 1;
}

// 后台管理用户条目
message AdminUserItem {
  int64 user_id = 1;
  string username = 2;
  string nickname = 3;
  string mobile = 4;
  string avatar = 5;
  ranfeed.commonpb.EnumValue status = 6;
  google.protobuf.Timestamp created_at = 7;
}

// 后台管理用户详情
message AdminUserDetail {
  int64 user_id = 1;
  string username = 2;
  string nickname = 3;
  string mobile = 4;
  string avatar = 5;
  ranfeed.commonpb.EnumValue status = 6;
  string bio = 7;
  ranfeed.commonpb.EnumValue gender = 8;
  string email = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

// 后台管理列表用户请求
message AdminListUsersReq {
  optional UserStatus status = 1;
  optional string username = 2;
  optional string nickname = 3;
  uint32 page = 4;
  uint32 page_size = 5;
}

// 后台管理列表用户响应
message AdminListUsersRes {
  repeated AdminUserItem items = 1;
  int64 total = 2;
  uint32 page = 3;
  uint32 page_size = 4;
}

// 后台管理获取用户详情请求
message AdminGetUserDetailReq {
  int64 user_id = 1;
}

// 后台管理获取用户详情响应
message AdminGetUserDetailRes {
  AdminUserDetail detail = 1;
}

// 后台管理设置用户状态请求
message AdminSetUserStatusReq {
  int64 user_id = 1;
  UserStatus status = 2;
  int64 operator_id = 3;
}

// C 端用户服务
service UserService {
  rpc Register(RegisterReq) returns (RegisterRes);
  rpc Login(LoginReq) returns (LoginRes);
  rpc Logout(LogoutReq) returns (google.protobuf.Empty);
  rpc GetMe(GetMeReq) returns (GetMeRes);
  rpc GetUser(GetUserReq) returns (GetUserRes);
  rpc GetUserProfile(GetUserProfileReq) returns (GetUserProfileRes);
  rpc BatchGetUser(BatchGetUserReq) returns (BatchGetUserRes);
  rpc BatchGetUserForIndex(BatchGetUserForIndexReq) returns (BatchGetUserForIndexRes);
  rpc ListUserForIndex(ListUserForIndexReq) returns (ListUserForIndexRes);
}

// 后台管理用户服务
service AdminUserService {
  rpc AdminListUsers(AdminListUsersReq) returns (AdminListUsersRes);
  rpc AdminGetUserDetail(AdminGetUserDetailReq) returns (AdminGetUserDetailRes);
  rpc AdminSetUserStatus(AdminSetUserStatusReq) returns (google.protobuf.Empty);
}
