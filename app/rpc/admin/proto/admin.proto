syntax = "proto3";

package ranfeed.admin;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "pkg/commonpb/common.proto";

option go_package = "ran-feed/app/rpc/admin/admin";

// AdminStatus 管理员账号状态
enum AdminStatus {
  ADMIN_STATUS_UNSPECIFIED = 0;
  ADMIN_STATUS_ENABLED = 10;
  ADMIN_STATUS_DISABLED = 20;
}

// OperateStatus 操作结果
enum OperateStatus {
  OPERATE_STATUS_UNSPECIFIED = 0;
  OPERATE_STATUS_SUCCESS = 1;
  OPERATE_STATUS_FAIL = 2;
}

// LoginStatus 登录结果
enum LoginStatus {
  LOGIN_STATUS_UNSPECIFIED = 0;
  LOGIN_STATUS_SUCCESS = 1;
  LOGIN_STATUS_FAIL = 2;
}

// GetAdminReq 查询管理员基本信息
message GetAdminReq {
  int64 admin_id = 1;
}

// GetAdminRes 管理员基本信息
message GetAdminRes {
  int64 admin_id = 1;
  string username = 2;
  string nickname = 3;
  ranfeed.commonpb.EnumValue status = 4;
}

// ListAdminPermissionsReq 查询管理员权限点集合
message ListAdminPermissionsReq {
  int64 admin_id = 1;
}

// ListAdminPermissionsRes 权限点 code 集合
message ListAdminPermissionsRes {
  repeated string codes = 1;
}

// WriteOperationLogReq 写操作审计日志 action 为业务权限码 如 content:takedown
message WriteOperationLogReq {
  int64 admin_id = 1;
  string action = 2;
  string ip = 3;
  string title = 4;
  OperateStatus status = 5;
  string error_msg = 6;
  int64 cost_time = 7;
  string user_agent = 8;
}

// WriteOperationLogRes 写入结果
message WriteOperationLogRes {
  int64 log_id = 1;
}

// PermissionItem 权限点目录项
message PermissionItem {
  int64 id = 1;
  string code = 2;
  string name = 3;
  string module = 4;
}

// ListPermissionsReq 查询权限点目录 module 空则全量
message ListPermissionsReq {
  string module = 1;
}

// ListPermissionsRes 权限点目录
message ListPermissionsRes {
  repeated PermissionItem items = 1;
}

// OperationLogItem 操作审计日志项
message OperationLogItem {
  int64 id = 1;
  int64 admin_id = 2;
  string action = 3;
  string ip = 4;
  string title = 5;
  ranfeed.commonpb.EnumValue status = 6;
  string error_msg = 7;
  int64 cost_time = 8;
  string user_agent = 9;
  google.protobuf.Timestamp created_at = 10;
  string username = 11;
}

// ListOperationLogsReq 查询操作审计日志
message ListOperationLogsReq {
  int64 admin_id = 1;
  string action = 2;
  OperateStatus status = 3;
  google.protobuf.Timestamp start_time = 4;
  google.protobuf.Timestamp end_time = 5;
  uint32 page = 6;
  uint32 page_size = 7;
  string username = 8;
}

// ListOperationLogsRes 审计日志分页查询结果
message ListOperationLogsRes {
  repeated OperationLogItem items = 1;
  int64 total = 2;
  uint32 page = 3;
  uint32 page_size = 4;
}

// WriteLoginLogReq 写登录日志 登录发生在认证前 admin_id 成功时填 失败为 0
message WriteLoginLogReq {
  int64 admin_id = 1;
  string username = 2;
  string ip = 3;
  string user_agent = 4;
  LoginStatus status = 5;
  string msg = 6;
}

// WriteLoginLogRes 写入结果
message WriteLoginLogRes {
  int64 log_id = 1;
}

// LoginLogItem 登录日志项
message LoginLogItem {
  int64 id = 1;
  int64 admin_id = 2;
  string username = 3;
  string ip = 4;
  string user_agent = 5;
  ranfeed.commonpb.EnumValue status = 6;
  string msg = 7;
  google.protobuf.Timestamp created_at = 8;
}

// ListLoginLogsReq 查询登录日志
message ListLoginLogsReq {
  string username = 1;
  string ip = 2;
  LoginStatus status = 3;
  google.protobuf.Timestamp start_time = 4;
  google.protobuf.Timestamp end_time = 5;
  uint32 page = 6;
  uint32 page_size = 7;
}

// ListLoginLogsRes 登录日志分页结果
message ListLoginLogsRes {
  repeated LoginLogItem items = 1;
  int64 total = 2;
  uint32 page = 3;
  uint32 page_size = 4;
}

// RoleItem 角色项
message RoleItem {
  int64 id = 1;
  string code = 2;
  string name = 3;
  string remark = 4;
  google.protobuf.Timestamp created_at = 5;
}

// ListRolesReq 角色分页
message ListRolesReq {
  uint32 page = 1;
  uint32 page_size = 2;
}

// ListRolesRes 角色分页结果
message ListRolesRes {
  repeated RoleItem items = 1;
  int64 total = 2;
  uint32 page = 3;
  uint32 page_size = 4;
}

// GetRoleDetailReq 角色详情
message GetRoleDetailReq {
  int64 id = 1;
}

// GetRoleDetailRes 角色详情含所绑权限点ID集合
message GetRoleDetailRes {
  RoleItem role = 1;
  repeated int64 permission_ids = 2;
}

// CreateRoleReq 建角色 code 唯一
message CreateRoleReq {
  string code = 1;
  string name = 2;
  string remark = 3;
  int64 operator_id = 4;
}

// CreateRoleRes 建角色结果
message CreateRoleRes {
  int64 id = 1;
}

// UpdateRoleReq 改角色 不可改 code
message UpdateRoleReq {
  int64 id = 1;
  string name = 2;
  string remark = 3;
  int64 operator_id = 4;
}

// SetRolePermissionsReq 覆盖式设角色权限点
message SetRolePermissionsReq {
  int64 role_id = 1;
  repeated int64 permission_ids = 2;
  int64 operator_id = 3;
}

// SetRolePermissionsRes 返回受影响管理员ID供上层失效权限缓存
message SetRolePermissionsRes {
  repeated int64 affected_admin_ids = 1;
}

// DeleteRoleReq 删角色
message DeleteRoleReq {
  int64 id = 1;
  int64 operator_id = 2;
}

// DeleteRoleRes 返回受影响管理员ID供上层失效权限缓存
message DeleteRoleRes {
  repeated int64 affected_admin_ids = 1;
}

// AdminListItem 管理员信息
message AdminListItem {
  int64 id = 1;
  string username = 2;
  string nickname = 3;
  ranfeed.commonpb.EnumValue status = 4;
  repeated string role_codes = 5;
  google.protobuf.Timestamp created_at = 6;
}

// ListAdminsReq 管理员分页查询 status 为空查全部
message ListAdminsReq {
  AdminStatus status = 1;
  uint32 page = 2;
  uint32 page_size = 3;
}

// ListAdminsRes 管理员分页查询结果
message ListAdminsRes {
  repeated AdminListItem items = 1;
  int64 total = 2;
  uint32 page = 3;
  uint32 page_size = 4;
}

// GetAdminDetailReq 管理员详情
message GetAdminDetailReq {
  int64 id = 1;
}

// GetAdminDetailRes 管理员详情含所绑角色ID集合
message GetAdminDetailRes {
  AdminListItem admin = 1;
  repeated int64 role_ids = 2;
}

// CreateAdminReq 创建管理员
message CreateAdminReq {
  string username = 1;
  string password = 2;
  string nickname = 3;
  repeated int64 role_ids = 4;
  int64 operator_id = 5;
}

// CreateAdminRes 建管理员结果
message CreateAdminRes {
  int64 id = 1;
}

// UpdateAdminReq 修改管理员昵称
message UpdateAdminReq {
  int64 id = 1;
  string nickname = 2;
  int64 operator_id = 3;
}

// SetAdminStatusReq 启用禁用管理员
message SetAdminStatusReq {
  int64 id = 1;
  AdminStatus status = 2;
  int64 operator_id = 3;
}

// ResetAdminPasswordReq 重置管理员密码
message ResetAdminPasswordReq {
  int64 id = 1;
  string new_password = 2;
  int64 operator_id = 3;
}

// SetAdminRolesReq 设置管理员角色
message SetAdminRolesReq {
  int64 admin_id = 1;
  repeated int64 role_ids = 2;
  int64 operator_id = 3;
}

// LoginReq 管理员登录
message LoginReq {
  string username = 1;
  string password = 2;
}

// LoginRes 登录结果
message LoginRes {
  int64 admin_id = 1;
  string nickname = 2;
  string token = 3;
  int64 ttl_seconds = 4;
  repeated string permissions = 5;
}

// AdminAuthService 认证管理
service AdminAuthService {
  rpc Login(LoginReq) returns (LoginRes);
  rpc GetAdmin(GetAdminReq) returns (GetAdminRes);
  rpc ListAdminPermissions(ListAdminPermissionsReq) returns (ListAdminPermissionsRes);
}

// AdminAuditService 操作与登录审计日志
service AdminAuditService {
  rpc WriteOperationLog(WriteOperationLogReq) returns (WriteOperationLogRes);
  rpc ListOperationLogs(ListOperationLogsReq) returns (ListOperationLogsRes);
  rpc WriteLoginLog(WriteLoginLogReq) returns (WriteLoginLogRes);
  rpc ListLoginLogs(ListLoginLogsReq) returns (ListLoginLogsRes);
}

// AdminPermissionService 权限点目录查询
service AdminPermissionService {
  rpc ListPermissions(ListPermissionsReq) returns (ListPermissionsRes);
}

// AdminRoleService 角色管理
service AdminRoleService {
  rpc ListRoles(ListRolesReq) returns (ListRolesRes);
  rpc GetRoleDetail(GetRoleDetailReq) returns (GetRoleDetailRes);
  rpc CreateRole(CreateRoleReq) returns (CreateRoleRes);
  rpc UpdateRole(UpdateRoleReq) returns (google.protobuf.Empty);
  rpc SetRolePermissions(SetRolePermissionsReq) returns (SetRolePermissionsRes);
  rpc DeleteRole(DeleteRoleReq) returns (DeleteRoleRes);
}

// AdminUserService 管理员账号管理
service AdminUserService {
  rpc ListAdmins(ListAdminsReq) returns (ListAdminsRes);
  rpc GetAdminDetail(GetAdminDetailReq) returns (GetAdminDetailRes);
  rpc CreateAdmin(CreateAdminReq) returns (CreateAdminRes);
  rpc UpdateAdmin(UpdateAdminReq) returns (google.protobuf.Empty);
  rpc SetAdminStatus(SetAdminStatusReq) returns (google.protobuf.Empty);
  rpc ResetAdminPassword(ResetAdminPasswordReq) returns (google.protobuf.Empty);
  rpc SetAdminRoles(SetAdminRolesReq) returns (google.protobuf.Empty);
}