syntax = "proto3";

package content;

option go_package = "./content";

// 内容类型枚举
enum ContentType {
  CONTENT_TYPE_UNKNOWN = 0;
  ARTICLE = 10;
  VIDEO = 20;
}

// 内容状态枚举
enum ContentStatus {
  STATUS_UNKNOWN = 0;
  DRAFT = 10;
  PROCESSING = 20;
  PUBLISHED = 30;
  FAILED = 40;
  TAKEN_DOWN = 50;      // 管理员下架
  PENDING_REVIEW = 60;  // 待审核 先审后发 Phase B feat-admin-005 起用
  REJECTED = 70;        // 审核拒绝 Phase B feat-admin-005 起用
}

// 可见性枚举
enum Visibility {
  VISIBILITY_UNKNOWN = 0;
  PUBLIC = 10;
  PRIVATE = 20;
}

message PageReq {
  uint32 page = 1;
  uint32 page_size = 2;
}

message PageRes {
  uint32 page = 1;
  uint32 page_size = 2;
  uint32 total = 3;
}

message ContentUploadsCredentialsReq {
  int64 user_id = 1;
  Scene scene = 2;
  FileExt file_ext = 3;
  int64 file_size = 4;
  string file_name = 5;
  enum Scene{
    SCENE_UNKNOWN = 0;
    ARTICLE_COVER = 1;
    VIDEO = 2;
    AVATAR = 3;
  }
  enum FileExt{
    FILE_EXT_UNKNOWN = 0;
    JPG = 1;
    PNG = 2;
    GIF = 3;
    MP4 = 4;
    MP3 = 5;
    DOC = 6;
    DOCX = 7;
    PDF = 8;
    XLS = 9;
  }
}

message ContentUploadsCredentialsRes {
  string object_key = 1;
  OssFormData form_data = 2;
  int64 expired_at = 3;
}

message OssFormData {
  string host = 1;
  string policy = 2;
  string signature = 3;
  string security_token = 4;
  string signature_version = 5;
  string credential = 6;
  string date = 7;
  string key = 8;
}

message ArticlePublishReq {
  int64 user_id = 1;
  string title = 2;
  optional string description = 3;
  string cover = 4;
  string content = 5;
  Visibility visibility = 6;
}

message ArticlePublishRes {
  int64 content_id = 1;
}

message VideoPublishReq {
  int64 user_id = 1;
  string title = 2;
  optional string description = 3;
  string video_url = 4;
  string cover_url = 5;
  int32 duration = 6;
  Visibility visibility = 7;
}

message VideoPublishRes {
  int64 content_id = 1;
}

message GetUserContentCountReq {
  int64 user_id = 1;
}

message GetUserContentCountRes {
  int64 content_count = 1;
}

message DeleteContentReq {
  int64 user_id = 1;
  int64 content_id = 2;
}

message DeleteContentRes {
}


message GetContentDetailReq {
  int64 content_id = 1;
  optional int64 viewer_id = 2;
}

message ContentDetail {
  int64 content_id = 1;
  ContentType content_type = 2;
  int64 author_id = 3;
  string author_name = 4;
  string author_avatar = 5;
  string title = 6;
  string description = 7;
  string cover_url = 8;
  string article_content = 9;
  string video_url = 10;
  int32 video_duration = 11;
  int64 published_at = 12;
  int64 like_count = 13;
  int64 favorite_count = 14;
  int64 comment_count = 15;
  bool is_liked = 16;
  bool is_favorited = 17;
  bool is_following_author = 18;
}

message GetContentDetailRes {
  ContentDetail detail = 1;
}

message RecommendFeedReq {
  optional int64 user_id = 1;
  string cursor = 2;
  uint32 page_size = 3;
  optional string snapshot_id = 4;
}

message RecommendFeedRes {
  repeated ContentItem items = 1;
  int64 next_cursor = 2;
  bool has_more = 3;
  string snapshot_id = 4;
}

message FollowFeedReq {
  int64 user_id = 1;
  string cursor = 2;
  uint32 page_size = 3;
}

message FollowFeedRes {
  repeated FollowFeedItem items = 1;
  string next_cursor = 2;
  bool has_more = 3;
}

message BackfillFollowInboxReq {
  int64 follower_id = 1;
  int64 followee_id = 2;
  uint32 limit = 3;
}

message BackfillFollowInboxRes {
  int32 added_count = 1;
}

message PurgeFolloweeFromInboxReq {
  int64 follower_id = 1;
  int64 followee_id = 2;
}

message PurgeFolloweeFromInboxRes {
  int32 removed_count = 1;
}

message UserPublishFeedReq {
  int64 author_id = 1;
  optional int64 viewer_id = 2;
  string cursor = 3;
  uint32 page_size = 4;
}

message UserPublishFeedRes {
  repeated ContentItem items = 1;
  string next_cursor = 2;
  bool has_more = 3;
}

message UserFavoriteFeedReq {
  optional int64 viewer_id = 1;
  int64 user_id = 2;
  string cursor = 3;
  uint32 page_size = 4;
}

message UserFavoriteFeedRes {
  repeated ContentItem items = 1;
  string next_cursor = 2;
  bool has_more = 3;
}

message ContentItem {
  int64 content_id = 1;
  ContentType content_type = 2;
  int64 author_id = 3;
  string author_name = 4;
  string author_avatar = 5;
  string title = 6;
  string cover_url = 7;
  int64 published_at = 8;
  bool is_liked = 9;
  int64 like_count = 10;
}

message FollowFeedItem {
  int64 content_id = 1;
  ContentType content_type = 2;
  int64 author_id = 3;
  string author_name = 4;
  string author_avatar = 5;
  string title = 6;
  string cover_url = 7;
  int64 published_at = 8;
  bool is_liked = 9;
  int64 like_count = 10;
}

// BatchGetContentItemsReq 按内容 id 批量富化 viewer_id 为 0 表示匿名
message BatchGetContentItemsReq {
  repeated int64 content_ids = 1;
  int64 viewer_id = 2;
}

// BatchGetContentItemsRes 按入参 id 顺序返回富化项 已删/非公开自动剔除
message BatchGetContentItemsRes {
  repeated ContentItem items = 1;
}

// ContentIndexItem 搜索建索引用的原始字段投影 只在可索引(已发布+公开+未删除)时返回
message ContentIndexItem {
  int64 content_id = 1;
  ContentType content_type = 2;
  ContentStatus status = 3;      // 恒为 PUBLISHED 带上供 search 纯拷贝写入 不再硬编码
  Visibility visibility = 4;     // 恒为 PUBLIC
  int64 author_id = 5;           // content.user_id
  string title = 6;
  string description = 7;        // article.description 视频为空
  string body = 8;               // article.content 正文 视频为空
  int64 published_at = 9;        // 毫秒
  double hot_score = 10;
  int64 version = 11;            // content.updated_at 毫秒 供全量重建 ES external version
}

// BatchGetContentForIndexReq 增量回源 按 content_id 批量取索引投影
message BatchGetContentForIndexReq {
  repeated int64 content_ids = 1;
}

message BatchGetContentForIndexRes {
  repeated ContentIndexItem items = 1;
}

// ListContentForIndexReq 全量重建 按 id keyset 游标扫可索引内容
message ListContentForIndexReq {
  int64 cursor = 1;
  int32 limit = 2;
}

message ListContentForIndexRes {
  repeated ContentIndexItem items = 1;
}

service ContentService{
  rpc Uploads(ContentUploadsCredentialsReq) returns (ContentUploadsCredentialsRes);
  rpc PublishArticle(ArticlePublishReq) returns (ArticlePublishRes);
  rpc PublishVideo(VideoPublishReq) returns (VideoPublishRes);
  rpc GetUserContentCount(GetUserContentCountReq) returns (GetUserContentCountRes);
  rpc DeleteContent(DeleteContentReq) returns (DeleteContentRes);
  rpc GetContentDetail(GetContentDetailReq) returns (GetContentDetailRes);
  rpc BackfillFollowInbox(BackfillFollowInboxReq) returns (BackfillFollowInboxRes);
  rpc PurgeFolloweeFromInbox(PurgeFolloweeFromInboxReq) returns (PurgeFolloweeFromInboxRes);
}

service FeedService{
  rpc RecommendFeed(RecommendFeedReq) returns (RecommendFeedRes);
  rpc FollowFeed(FollowFeedReq) returns (FollowFeedRes);
  rpc UserPublishFeed(UserPublishFeedReq) returns (UserPublishFeedRes);
  rpc UserFavoriteFeed(UserFavoriteFeedReq) returns (UserFavoriteFeedRes);
  rpc BatchGetContentItems(BatchGetContentItemsReq) returns (BatchGetContentItemsRes);
  rpc BatchGetContentForIndex(BatchGetContentForIndexReq) returns (BatchGetContentForIndexRes);
  rpc ListContentForIndex(ListContentForIndexReq) returns (ListContentForIndexRes);
}

// ===== admin 管理端 (feat-admin-004) 与 C 端接口物理隔离 复用 content 域 repo =====

// AdminContentItem 管理端内容列表项 纯管理视角 不做展示富化 含非公开与各状态
message AdminContentItem {
  int64 content_id = 1;
  ContentType content_type = 2;
  ContentStatus status = 3;
  Visibility visibility = 4;
  int64 author_id = 5;
  string title = 6;
  int64 like_count = 7;
  int64 favorite_count = 8;
  int64 comment_count = 9;
  int64 published_at = 10;  // 毫秒 0 表示未发布
  int64 created_at = 11;    // 毫秒
}

// AdminListContentsReq 多条件筛选 + id keyset 游标分页 status/content_type/author 均可选
message AdminListContentsReq {
  optional ContentStatus status = 1;
  optional ContentType content_type = 2;
  optional int64 author_id = 3;
  int64 cursor_id = 4;  // 上页末条 id 0 表示首页
  int32 page_size = 5;
}

message AdminListContentsRes {
  repeated AdminContentItem items = 1;
  int64 next_cursor = 2;  // 0 表示无更多
  bool has_more = 3;
}

message AdminGetContentDetailReq {
  int64 content_id = 1;
}

// AdminContentDetail 管理端详情 含正文/非公开 无 viewer 相关互动字段
message AdminContentDetail {
  int64 content_id = 1;
  ContentType content_type = 2;
  ContentStatus status = 3;
  Visibility visibility = 4;
  int64 author_id = 5;
  string title = 6;
  string description = 7;
  string cover_url = 8;
  string article_content = 9;
  string video_url = 10;
  int32 video_duration = 11;
  int64 like_count = 12;
  int64 favorite_count = 13;
  int64 comment_count = 14;
  int64 published_at = 15;  // 毫秒 0 表示未发布
  int64 created_at = 16;    // 毫秒
  int64 updated_at = 17;    // 毫秒
}

message AdminGetContentDetailRes {
  AdminContentDetail detail = 1;
}

// AdminSetContentStatusReq 下架/恢复 本轮支持 TAKEN_DOWN(下架) 与 PUBLISHED(恢复)
message AdminSetContentStatusReq {
  int64 content_id = 1;
  ContentStatus status = 2;
  int64 operator_id = 3;  // 操作管理员 id 落 updated_by
}

message AdminSetContentStatusRes {
  ContentStatus status = 1;  // 变更后状态
}

service AdminContentService{
  rpc AdminListContents(AdminListContentsReq) returns (AdminListContentsRes);
  rpc AdminGetContentDetail(AdminGetContentDetailReq) returns (AdminGetContentDetailRes);
  rpc AdminSetContentStatus(AdminSetContentStatusReq) returns (AdminSetContentStatusRes);
}
