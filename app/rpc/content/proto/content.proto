syntax = "proto3";

package ranfeed.content;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "pkg/commonpb/common.proto";

option go_package = "ran-feed/app/rpc/content/content";

// 内容类型枚举
enum ContentType {
  CONTENT_TYPE_UNSPECIFIED = 0;  // 未指定
  CONTENT_TYPE_ARTICLE = 10;     // 文章
  CONTENT_TYPE_VIDEO = 20;       // 视频
}

// 内容状态枚举
enum ContentStatus {
  CONTENT_STATUS_UNSPECIFIED = 0;   // 未指定
  CONTENT_STATUS_DRAFT = 10;        // 草稿
  CONTENT_STATUS_PROCESSING = 20;   // 处理中
  CONTENT_STATUS_PUBLISHED = 30;    // 已发布
  CONTENT_STATUS_FAILED = 40;       // 失败
  CONTENT_STATUS_TAKEN_DOWN = 50;   // 管理员下架
  CONTENT_STATUS_PENDING_REVIEW = 60;  // 待审核
  CONTENT_STATUS_REJECTED = 70;     // 审核拒绝
}

// 可见性枚举
enum Visibility {
  VISIBILITY_UNSPECIFIED = 0;  // 未指定
  VISIBILITY_PUBLIC = 10;      // 公开
  VISIBILITY_PRIVATE = 20;     // 私密
}

// 审核决策枚举 含管理端下架与恢复 使审核记录表可查这两类历史
enum ReviewDecision {
  REVIEW_DECISION_UNSPECIFIED = 0;  // 未指定
  REVIEW_DECISION_APPROVE = 10;     // 通过
  REVIEW_DECISION_REJECT = 20;      // 拒绝
  REVIEW_DECISION_TAKEN_DOWN = 30;  // 管理端下架
  REVIEW_DECISION_RESTORED = 40;    // 管理端恢复
}

// 上传场景枚举
enum UploadScene {
  UPLOAD_SCENE_UNSPECIFIED = 0;    // 未指定
  UPLOAD_SCENE_ARTICLE_COVER = 1;  // 文章封面
  UPLOAD_SCENE_VIDEO = 2;          // 视频
  UPLOAD_SCENE_AVATAR = 3;         // 头像
}

// 上传文件扩展名枚举
enum FileExt {
  FILE_EXT_UNSPECIFIED = 0;  // 未指定
  FILE_EXT_JPG = 1;          // jpg
  FILE_EXT_PNG = 2;          // png
  FILE_EXT_GIF = 3;          // gif
  FILE_EXT_MP4 = 4;          // mp4
  FILE_EXT_MP3 = 5;          // mp3
  FILE_EXT_DOC = 6;          // doc
  FILE_EXT_DOCX = 7;         // docx
  FILE_EXT_PDF = 8;          // pdf
  FILE_EXT_XLS = 9;          // xls
}

// ContentUploadsCredentialsReq 获取 OSS 上传凭证
message ContentUploadsCredentialsReq {
  int64 user_id = 1;
  UploadScene scene = 2;
  FileExt file_ext = 3;
  int64 file_size = 4;
  string file_name = 5;
}

// ContentUploadsCredentialsRes 上传凭证响应
message ContentUploadsCredentialsRes {
  string url = 1;
  string method = 2;
  string object_key = 3;
  map<string, string> form_fields = 4;
  google.protobuf.Timestamp expired_at = 5;
}

// ArticlePublishReq 发布文章
message ArticlePublishReq {
  int64 user_id = 1;
  string title = 2;
  optional string description = 3;
  string cover = 4;
  string content = 5;
  Visibility visibility = 6;
}

// ArticlePublishRes 发布文章响应
message ArticlePublishRes {
  int64 content_id = 1;
}

// VideoPublishReq 发布视频
message VideoPublishReq {
  int64 user_id = 1;
  string title = 2;
  optional string description = 3;
  string video_url = 4;
  string cover_url = 5;
  int32 duration = 6;
  Visibility visibility = 7;
}

// VideoPublishRes 发布视频响应
message VideoPublishRes {
  int64 content_id = 1;
}

// GetUserContentCountReq 查用户内容数
message GetUserContentCountReq {
  int64 user_id = 1;
}

// GetUserContentCountRes 用户内容数
message GetUserContentCountRes {
  int64 content_count = 1;
}

// DeleteContentReq 删除内容
message DeleteContentReq {
  int64 user_id = 1;
  int64 content_id = 2;
}

// GetContentDetailReq 内容详情请求 viewer_id 为 0 表示匿名
message GetContentDetailReq {
  int64 content_id = 1;
  optional int64 viewer_id = 2;
}

// ContentDetail 内容详情 含 viewer 相关互动字段
message ContentDetail {
  int64 content_id = 1;
  ranfeed.commonpb.EnumValue content_type = 2;  // 内容类型
  int64 author_id = 3;
  string author_name = 4;
  string author_avatar = 5;
  string title = 6;
  string description = 7;
  string cover_url = 8;
  string article_content = 9;
  string video_url = 10;
  int32 video_duration = 11;
  google.protobuf.Timestamp published_at = 12;  // 发布时间 秒
  int64 like_count = 13;
  int64 favorite_count = 14;
  int64 comment_count = 15;
  bool is_liked = 16;
  bool is_favorited = 17;
  bool is_following_author = 18;
}

// GetContentDetailRes 内容详情响应
message GetContentDetailRes {
  ContentDetail detail = 1;
}

// SaveArticleDraftReq 保存文章草稿 content_id 为空新建 有值更新 校验放宽
message SaveArticleDraftReq {
  int64 user_id = 1;
  optional int64 content_id = 2;
  string title = 3;
  optional string description = 4;
  string cover = 5;
  string content = 6;
  Visibility visibility = 7;
}

// SaveArticleDraftRes 保存文章草稿响应
message SaveArticleDraftRes {
  int64 content_id = 1;
}

// SaveVideoDraftReq 保存视频草稿 content_id 为空新建 有值更新 校验放宽
message SaveVideoDraftReq {
  int64 user_id = 1;
  optional int64 content_id = 2;
  string title = 3;
  optional string description = 4;
  string video_url = 5;
  string cover_url = 6;
  int32 duration = 7;
  Visibility visibility = 8;
}

// SaveVideoDraftRes 保存视频草稿响应
message SaveVideoDraftRes {
  int64 content_id = 1;
}

// SubmitContentReq 草稿或被拒内容提交进审核
message SubmitContentReq {
  int64 user_id = 1;
  int64 content_id = 2;
}

// SubmitContentRes 提交响应
message SubmitContentRes {
  int64 content_id = 1;
}

// MyContentListReq 我的内容列表 全状态 cursor 为 created_at:id 复合游标
message MyContentListReq {
  int64 user_id = 1;
  optional ContentStatus status = 2;
  optional ContentType content_type = 3;
  string cursor = 4;
  uint32 page_size = 5;
}

// MyContentItem 我的内容列表项
message MyContentItem {
  int64 content_id = 1;
  ranfeed.commonpb.EnumValue content_type = 2;  // 内容类型
  ranfeed.commonpb.EnumValue status = 3;        // 内容状态
  ranfeed.commonpb.EnumValue visibility = 4;    // 可见性
  string title = 5;
  string cover_url = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp published_at = 8;   // 未发布为空
  string status_reason = 9;                     // 不可见原因 拒绝取最新拒绝理由 下架取最新下架原因
  int64 like_count = 10;
  int64 favorite_count = 11;
  int64 comment_count = 12;
}

// MyContentListRes 我的内容列表响应
message MyContentListRes {
  repeated MyContentItem items = 1;
  string next_cursor = 2;
  bool has_more = 3;
}

// RecommendFeedReq 推荐流请求
message RecommendFeedReq {
  optional int64 user_id = 1;
  string cursor = 2;
  uint32 page_size = 3;
  optional string snapshot_id = 4;
}

// RecommendFeedRes 推荐流响应
message RecommendFeedRes {
  repeated ContentItem items = 1;
  string next_cursor = 2;
  bool has_more = 3;
  string snapshot_id = 4;
}

// FollowFeedReq 关注流请求
message FollowFeedReq {
  int64 user_id = 1;
  string cursor = 2;
  uint32 page_size = 3;
}

// FollowFeedRes 关注流响应
message FollowFeedRes {
  repeated FollowFeedItem items = 1;
  string next_cursor = 2;
  bool has_more = 3;
}

// UserPublishFeedReq 用户发布列表请求
message UserPublishFeedReq {
  int64 author_id = 1;
  optional int64 viewer_id = 2;
  string cursor = 3;
  uint32 page_size = 4;
}

// UserPublishFeedRes 用户发布列表响应
message UserPublishFeedRes {
  repeated ContentItem items = 1;
  string next_cursor = 2;
  bool has_more = 3;
}

// UserFavoriteFeedReq 用户收藏列表请求
message UserFavoriteFeedReq {
  optional int64 viewer_id = 1;
  int64 user_id = 2;
  string cursor = 3;
  uint32 page_size = 4;
}

// UserFavoriteFeedRes 用户收藏列表响应
message UserFavoriteFeedRes {
  repeated ContentItem items = 1;
  string next_cursor = 2;
  bool has_more = 3;
}

// BackfillFollowInboxReq 关注时回填收件箱
message BackfillFollowInboxReq {
  int64 follower_id = 1;
  int64 followee_id = 2;
  uint32 limit = 3;
}

// BackfillFollowInboxRes 回填结果
message BackfillFollowInboxRes {
  int32 added_count = 1;
}

// PurgeFolloweeFromInboxReq 取关后清除收件箱
message PurgeFolloweeFromInboxReq {
  int64 follower_id = 1;
  int64 followee_id = 2;
}

// PurgeFolloweeFromInboxRes 清除结果
message PurgeFolloweeFromInboxRes {
  int32 removed_count = 1;
}

// ContentItem 内容列表项
message ContentItem {
  int64 content_id = 1;
  ranfeed.commonpb.EnumValue content_type = 2;  // 内容类型
  int64 author_id = 3;
  string author_name = 4;
  string author_avatar = 5;
  string title = 6;
  string cover_url = 7;
  google.protobuf.Timestamp published_at = 8;  // 发布时间 秒
  bool is_liked = 9;
  int64 like_count = 10;
}

// FollowFeedItem 关注流列表项
message FollowFeedItem {
  int64 content_id = 1;
  ranfeed.commonpb.EnumValue content_type = 2;  // 内容类型
  int64 author_id = 3;
  string author_name = 4;
  string author_avatar = 5;
  string title = 6;
  string cover_url = 7;
  google.protobuf.Timestamp published_at = 8;  // 发布时间 秒
  bool is_liked = 9;
  int64 like_count = 10;
}

// BatchGetContentItemsReq 按内容 id 批量富化 viewer_id 为 0 表示匿名
message BatchGetContentItemsReq {
  repeated int64 content_ids = 1;
  int64 viewer_id = 2;
}

// BatchGetContentItemsRes 按入参 id 顺序返回富化项 已删/非公开自动剔除
message BatchGetContentItemsRes {
  repeated ContentItem items = 1;
}

// ContentIndexItem 搜索建索引用的原始字段投影 只在可索引(已发布+公开+未删除)时返回
message ContentIndexItem {
  int64 content_id = 1;
  ContentType content_type = 2;
  ContentStatus status = 3;      // 恒为 PUBLISHED 带上供 search 纯拷贝写入 不再硬编码
  Visibility visibility = 4;     // 恒为 PUBLIC
  int64 author_id = 5;           // content.user_id
  string title = 6;
  string description = 7;        // article.description 视频为空
  string body = 8;               // article.content 正文 视频为空
  google.protobuf.Timestamp published_at = 9;  // 发布时间 毫秒
  double hot_score = 10;
  int64 version = 11;            // content.updated_at 毫秒 供全量重建 ES external version
}

// BatchGetContentForIndexReq 增量回源 按 content_id 批量取索引投影
message BatchGetContentForIndexReq {
  repeated int64 content_ids = 1;
}

// BatchGetContentForIndexRes 批量索引投影响应
message BatchGetContentForIndexRes {
  repeated ContentIndexItem items = 1;
}

// ListContentForIndexReq 全量重建 按 id keyset 游标扫可索引内容
message ListContentForIndexReq {
  int64 cursor = 1;
  int32 limit = 2;
}

// ListContentForIndexRes 全量索引投影响应
message ListContentForIndexRes {
  repeated ContentIndexItem items = 1;
}

// AdminContentItem 管理端内容列表项
message AdminContentItem {
  int64 content_id = 1;
  ranfeed.commonpb.EnumValue content_type = 2;  // 内容类型
  ranfeed.commonpb.EnumValue status = 3;        // 内容状态
  ranfeed.commonpb.EnumValue visibility = 4;    // 可见性
  int64 author_id = 5;
  string username = 6;
  string title = 7;
  int64 like_count = 8;
  int64 favorite_count = 9;
  int64 comment_count = 10;
  google.protobuf.Timestamp published_at = 11;
  google.protobuf.Timestamp created_at = 12;
}

// AdminListContentsReq 管理端内容列表请求
message AdminListContentsReq {
  optional ContentStatus status = 1;
  optional ContentType content_type = 2;
  optional int64 author_id = 3;
  uint32 page = 4;
  uint32 page_size = 5;
}

// AdminListContentsRes 管理端内容列表响应
message AdminListContentsRes {
  repeated AdminContentItem items = 1;
  int64 total = 2;
  uint32 page = 3;
  uint32 page_size = 4;
}

// AdminGetContentDetailReq 管理端内容详情请求
message AdminGetContentDetailReq {
  int64 content_id = 1;
}

// AdminContentDetail 管理端内容详情
message AdminContentDetail {
  int64 content_id = 1;
  ranfeed.commonpb.EnumValue content_type = 2;  // 内容类型
  ranfeed.commonpb.EnumValue status = 3;        // 内容状态
  ranfeed.commonpb.EnumValue visibility = 4;    // 可见性
  int64 author_id = 5;
  string username = 6;
  string title = 7;
  string description = 8;
  string cover_url = 9;
  string article_content = 10;
  string video_url = 11;
  int32 video_duration = 12;
  int64 like_count = 13;
  int64 favorite_count = 14;
  int64 comment_count = 15;
  google.protobuf.Timestamp published_at = 16;  // 发布时间
  google.protobuf.Timestamp created_at = 17;    // 创建时间
  google.protobuf.Timestamp updated_at = 18;    // 更新时间
}

// AdminGetContentDetailRes 管理端内容详情响应
message AdminGetContentDetailRes {
  AdminContentDetail detail = 1;
}

// AdminSetContentStatusReq 下架/恢复
message AdminSetContentStatusReq {
  int64 content_id = 1;
  ContentStatus status = 2;
  int64 operator_id = 3;
  optional string reason = 4;
}

// AdminSetContentStatusRes 状态变更响应
message AdminSetContentStatusRes {
  ranfeed.commonpb.EnumValue status = 1;
}

// AdminReviewContentReq 审核内容请求
message AdminReviewContentReq {
  int64 content_id = 1;
  ReviewDecision decision = 2;
  int64 operator_id = 3;
  string reject_reason = 4;
}

// AdminReviewContentRes 审核结果响应
message AdminReviewContentRes {
  ranfeed.commonpb.EnumValue status = 1;
}

// ClearUserFavoriteCacheReq 失效用户收藏流缓存请求
message ClearUserFavoriteCacheReq {
  int64 user_id = 1;
}

service ContentService {
  rpc Uploads(ContentUploadsCredentialsReq) returns (ContentUploadsCredentialsRes);
  rpc PublishArticle(ArticlePublishReq) returns (ArticlePublishRes);
  rpc PublishVideo(VideoPublishReq) returns (VideoPublishRes);
  rpc SaveArticleDraft(SaveArticleDraftReq) returns (SaveArticleDraftRes);
  rpc SaveVideoDraft(SaveVideoDraftReq) returns (SaveVideoDraftRes);
  rpc SubmitContent(SubmitContentReq) returns (SubmitContentRes);
  rpc MyContentList(MyContentListReq) returns (MyContentListRes);
  rpc GetUserContentCount(GetUserContentCountReq) returns (GetUserContentCountRes);
  rpc DeleteContent(DeleteContentReq) returns (google.protobuf.Empty);
  rpc GetContentDetail(GetContentDetailReq) returns (GetContentDetailRes);
  rpc BackfillFollowInbox(BackfillFollowInboxReq) returns (BackfillFollowInboxRes);
  rpc PurgeFolloweeFromInbox(PurgeFolloweeFromInboxReq) returns (PurgeFolloweeFromInboxRes);
  rpc ClearUserFavoriteCache(ClearUserFavoriteCacheReq) returns (google.protobuf.Empty);
}

service FeedService {
  rpc RecommendFeed(RecommendFeedReq) returns (RecommendFeedRes);
  rpc FollowFeed(FollowFeedReq) returns (FollowFeedRes);
  rpc UserPublishFeed(UserPublishFeedReq) returns (UserPublishFeedRes);
  rpc UserFavoriteFeed(UserFavoriteFeedReq) returns (UserFavoriteFeedRes);
  rpc BatchGetContentItems(BatchGetContentItemsReq) returns (BatchGetContentItemsRes);
  rpc BatchGetContentForIndex(BatchGetContentForIndexReq) returns (BatchGetContentForIndexRes);
  rpc ListContentForIndex(ListContentForIndexReq) returns (ListContentForIndexRes);
}

service AdminContentService {
  rpc AdminListContents(AdminListContentsReq) returns (AdminListContentsRes);
  rpc AdminGetContentDetail(AdminGetContentDetailReq) returns (AdminGetContentDetailRes);
  rpc AdminSetContentStatus(AdminSetContentStatusReq) returns (AdminSetContentStatusRes);
  rpc AdminReviewContent(AdminReviewContentReq) returns (AdminReviewContentRes);
}
