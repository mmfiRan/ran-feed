Name: search.rpc
ListenOn: 0.0.0.0:5006
Etcd:
  Hosts:
  - ${ETCD_HOST}:2379
  Key: search.rpc

Telemetry:
  Name: search.rpc-server
  Endpoint: ${OTEL_ENDPOINT}
  Batcher: otlpgrpc
  Sampler: 1.0

Prometheus:
  Host: ${PROM_HOST}
  Port: 9296
  Path: /metrics

Log:
  ServiceName: "search.rpc"
  Mode: "file"
  Encoding: "json"
  TimeFormat: "2006-01-02T15:04:05.000Z07:00"
  Path: ${LOG_PATH}
  Level: "info"
  MaxContentLength: 0
  Compress: false
  Stat: true
  KeepDays: 1
  StackCooldownMillis: 100
  MaxBackups: 0
  MaxSize: 0
  Rotation: "daily"
  FileTimeFormat: "2006-01-02T15:04:05.000Z07:00"

# Elasticsearch 搜索索引 无认证时 Username/Password 留空
Elasticsearch:
  Addresses:
    - ${ES_ADDRESS}
  Username: ${ES_USERNAME}
  Password: ${ES_PASSWORD}

MySQL:
  DataSource: ${MYSQL_APP_USER}:${MYSQL_APP_PASSWORD}@tcp(${MYSQL_HOST}:3306)/ran-feed?charset=utf8mb4&parseTime=true&loc=Asia%2FShanghai

ContentRpcClientConf:
  Etcd:
    Hosts:
      - ${ETCD_HOST}:2379
    Key: content.rpc
  NonBlock: true

UserRpcClientConf:
  Etcd:
    Hosts:
      - ${ETCD_HOST}:2379
    Key: user.rpc
  NonBlock: true

# kafka 消费者配置 canal search
KqConsumerConf:
  Name: search-canal-consumer
  Brokers:
    - ${KAFKA_BROKERS}
  Group: ran-feed-search-canal-consumer
  Topic: ran-feed-search-canal
  Offset: last
  Consumers: 2
  Processors: 2

# xxl-job 执行器配置 全量回填/周期重建任务
XxlJob:
  AppName: ran-feed-search-cron
  Address: ${SEARCH_XXL_EXECUTOR_ADDRESS}
  IP: ${SEARCH_XXL_EXECUTOR_IP}
  Port: ${SEARCH_XXL_EXECUTOR_PORT}
  AccessToken: ${XXL_JOB_ACCESS_TOKEN}
  AdminAddresses:
    - ${XXL_JOB_ADMIN_ADDR}
  RegistryInterval: 30s
  HTTPTimeout: 10s
