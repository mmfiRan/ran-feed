syntax = "proto3";

package ranfeed.interaction;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option go_package = "ran-feed/app/rpc/interaction/interaction";

// PageReq 分页请求
message PageReq {
  uint32 page = 1;      // 页码 从 1 开始
  uint32 page_size = 2; // 每页条数
}

// PageRes 分页响应
message PageRes {
  uint32 page = 1;      // 页码
  uint32 page_size = 2; // 每页条数
  int64 total = 3;      // 总条数
}

// Scene 互动场景 与 content 域内容类型对齐
enum Scene {
  SCENE_UNSPECIFIED = 0; // 未指定
  SCENE_ARTICLE = 10;    // 图文
  SCENE_VIDEO = 20;      // 视频
  SCENE_COMMENT = 30;    // 评论
}

// LikeReq 点赞请求
message LikeReq {
  int64 user_id = 1;         // 点赞用户ID
  int64 content_id = 2;      // 内容ID
  int64 content_user_id = 3; // 内容作者ID 用于发通知
  Scene scene = 4;           // 场景
}

// UnlikeReq 取消点赞请求
message UnlikeReq {
  int64 user_id = 1;         // 取消点赞用户ID
  int64 content_id = 2;      // 内容ID
  int64 content_user_id = 3; // 内容作者ID
  Scene scene = 4;           // 场景
}

// QueryLikeInfoReq 查询点赞信息请求
message QueryLikeInfoReq {
  int64 user_id = 1;    // 用户ID
  int64 content_id = 2; // 内容ID
  Scene scene = 3;      // 场景
}

// QueryLikeInfoRes 查询点赞信息响应
message QueryLikeInfoRes {
  int64 like_count = 1;  // 点赞总数
  bool is_liked = 2;     // 当前用户是否已点赞
  int64 content_id = 3;  // 内容ID
  Scene scene = 4;       // 场景
}

// BatchQueryLikeInfoReq 批量查询点赞信息请求
message BatchQueryLikeInfoReq {
  int64 user_id = 1;                 // 用户ID
  repeated LikeInfo like_infos = 2;  // 待查内容列表
}

// BatchQueryLikeInfoRes 批量查询点赞信息响应
message BatchQueryLikeInfoRes {
  repeated QueryLikeInfoRes like_infos = 1; // 与请求顺序一致的结果
}

// LikeInfo 单个内容的互动定位
message LikeInfo {
  int64 content_id = 1; // 内容ID
  Scene scene = 2;      // 场景
}

// IsLikedInfo 单个内容的点赞态
message IsLikedInfo {
  int64 content_id = 1; // 内容ID
  Scene scene = 2;      // 场景
  bool is_liked = 3;    // 是否已点赞
}

// BatchQueryIsLikedReq 批量查询点赞态请求 user_id 不传表示只看内容维度
message BatchQueryIsLikedReq {
  optional int64 user_id = 1;        // 用户ID 不传表示不限
  repeated LikeInfo like_infos = 2;  // 待查内容列表
}

// BatchQueryIsLikedRes 批量查询点赞态响应
message BatchQueryIsLikedRes {
  repeated IsLikedInfo is_liked_infos = 1; // 与请求顺序一致的结果
}

// FavoriteReq 收藏请求
message FavoriteReq {
  int64 user_id = 1;         // 收藏用户ID
  int64 content_id = 2;      // 内容ID
  int64 content_user_id = 3; // 内容作者ID 用于发通知
  Scene scene = 4;           // 场景
}

// RemoveFavoriteReq 取消收藏请求
message RemoveFavoriteReq {
  int64 user_id = 1;    // 取消收藏用户ID
  int64 content_id = 2; // 内容ID
  Scene scene = 3;      // 场景
}

// QueryFavoriteInfoReq 查询收藏信息请求
message QueryFavoriteInfoReq {
  int64 user_id = 1;    // 用户ID
  int64 content_id = 2; // 内容ID
  Scene scene = 3;      // 场景
}

// QueryFavoriteInfoRes 查询收藏信息响应
message QueryFavoriteInfoRes {
  int64 favorite_count = 1; // 收藏总数
  bool is_favorited = 2;    // 当前用户是否已收藏
  int64 content_id = 3;     // 内容ID
  Scene scene = 4;          // 场景
}

// QueryFavoriteListReq 收藏列表请求 游标分页
message QueryFavoriteListReq {
  int64 user_id = 1;  // 用户ID
  int64 cursor = 2;   // 游标 0 表示首页
  uint32 page_size = 3; // 每页条数
}

// FavoriteItem 收藏项
message FavoriteItem {
  int64 favorite_id = 1;     // 收藏记录ID
  int64 content_id = 2;      // 内容ID
  int64 content_user_id = 3; // 内容作者ID
}

// QueryFavoriteListRes 收藏列表响应
message QueryFavoriteListRes {
  repeated FavoriteItem items = 1; // 收藏项
  int64 next_cursor = 2;           // 下一页游标
  bool has_more = 3;               // 是否还有下一页
}

// CommentReq 发表评论请求
message CommentReq {
  int64 user_id = 1;         // 评论用户ID
  int64 content_id = 2;      // 内容ID
  Scene scene = 3;           // 场景
  string comment = 4;        // 评论内容
  int64 parent_id = 5;       // 直接父评论ID 0 表示顶级
  int64 root_id = 6;         // 根评论ID 0 表示顶级
  int64 reply_to_user_id = 7; // 被回复用户ID
  int64 content_user_id = 8;  // 内容作者ID 用于发通知
}

// CommentRes 发表评论响应
message CommentRes {
  int64 comment_id = 1; // 新评论ID
}

// DeleteCommentReq 删除评论请求 reserved 4 为历史跳号
message DeleteCommentReq {
  reserved 4;
  int64 user_id = 1;              // 删除操作者ID
  int64 comment_id = 2;           // 评论ID
  int64 content_id = 3;           // 内容ID
  optional int64 root_id = 5;     // 根评论ID 用于回写计数
  optional int64 parent_id = 6;   // 父评论ID 用于回写计数
  Scene scene = 7;                // 场景
}

// CommentItem 评论项 富化用户名与头像
message CommentItem {
  int64 comment_id = 1;        // 评论ID
  int64 content_id = 2;        // 内容ID
  int64 user_id = 3;           // 评论用户ID
  int64 reply_to_user_id = 4;  // 被回复用户ID
  int64 parent_id = 5;         // 直接父评论ID
  int64 root_id = 6;           // 根评论ID
  string comment = 7;          // 评论内容
  google.protobuf.Timestamp created_at = 8; // 创建时间
  int32 status = 9;            // 评论状态
  string user_name = 10;       // 评论人昵称
  string user_avatar = 11;     // 评论人头像
  int64 reply_count = 12;      // 回复数
}

// QueryCommentListReq 评论列表请求 游标分页
message QueryCommentListReq {
  int64 content_id = 1; // 内容ID
  Scene scene = 2;      // 场景
  int64 cursor = 3;     // 游标 0 表示首页
  uint32 page_size = 4; // 每页条数
}

// QueryCommentListRes 评论列表响应
message QueryCommentListRes {
  repeated CommentItem comments = 1; // 评论项
  int64 next_cursor = 2;             // 下一页游标
  bool has_more = 3;                 // 是否还有下一页
}

// QueryReplyListReq 回复列表请求 游标分页
message QueryReplyListReq {
  int64 root_id = 1;    // 根评论ID
  int64 cursor = 2;     // 游标 0 表示首页
  uint32 page_size = 3; // 每页条数
}

// QueryReplyListRes 回复列表响应
message QueryReplyListRes {
  int64 root_id = 1;                 // 根评论ID
  repeated CommentItem replies = 2;  // 回复项
  int64 next_cursor = 3;             // 下一页游标
  bool has_more = 4;                 // 是否还有下一页
}

// BatchGetCommentsReq 批量取评论请求
message BatchGetCommentsReq {
  repeated int64 comment_ids = 1; // 评论ID集合
}

// BatchGetCommentsRes 批量取评论响应
message BatchGetCommentsRes {
  repeated CommentItem comments = 1; // 命中的评论项
  repeated int64 miss_ids = 2;       // 未命中的评论ID
}

// RefillCommentCacheReq 回填评论缓存请求
message RefillCommentCacheReq {
  repeated int64 comment_ids = 1; // 待回填的评论ID集合
}

// RefillCommentCacheRes 回填评论缓存响应
message RefillCommentCacheRes {
  repeated CommentItem comments = 1; // 回填的评论项
}

// FollowUserReq 关注请求
message FollowUserReq {
  int64 user_id = 1;        // 关注发起人ID
  int64 follow_user_id = 2; // 被关注人ID
}

// FollowUserRes 关注响应
message FollowUserRes {
  bool is_followed = 1; // 是否已关注
}

// UnfollowUserReq 取关请求
message UnfollowUserReq {
  int64 user_id = 1;        // 取关发起人ID
  int64 follow_user_id = 2; // 被取关人ID
}

// UnfollowUserRes 取关响应
message UnfollowUserRes {
  bool is_followed = 1; // 是否仍关注
}

// ListFolloweesReq 关注列表请求 游标分页
message ListFolloweesReq {
  int64 user_id = 1;    // 用户ID
  int64 cursor = 2;     // 游标 0 表示首页
  uint32 page_size = 3; // 每页条数
}

// ListFolloweesRes 关注列表响应
message ListFolloweesRes {
  repeated int64 follow_user_ids = 1; // 被关注人ID列表
  int64 next_cursor = 2;              // 下一页游标
  bool has_more = 3;                  // 是否还有下一页
}

// ListFollowersReq 粉丝列表请求 游标分页
message ListFollowersReq {
  int64 user_id = 1;    // 用户ID
  int64 cursor = 2;     // 游标 0 表示首页
  uint32 page_size = 3; // 每页条数
}

// ListFollowersRes 粉丝列表响应
message ListFollowersRes {
  repeated int64 follower_user_ids = 1; // 粉丝ID列表
  int64 next_cursor = 2;                // 下一页游标
  bool has_more = 3;                    // 是否还有下一页
}

// GetFollowSummaryReq 关注概览请求 viewer_id 决定 is_following
message GetFollowSummaryReq {
  int64 user_id = 1;             // 被查看用户ID
  optional int64 viewer_id = 2;  // 查看者ID 不传表示未登录
}

// GetFollowSummaryRes 关注概览响应
message GetFollowSummaryRes {
  int64 followee_count = 1; // 关注数
  int64 follower_count = 2; // 粉丝数
  bool is_following = 3;    // 查看者是否已关注
}

// LikeService 点赞与点赞态查询
service LikeService {
  rpc Like(LikeReq) returns (google.protobuf.Empty);
  rpc Unlike(UnlikeReq) returns (google.protobuf.Empty);
  rpc QueryLikeInfo(QueryLikeInfoReq) returns (QueryLikeInfoRes);
  rpc BatchQueryLikeInfo(BatchQueryLikeInfoReq) returns (BatchQueryLikeInfoRes);
  rpc BatchQueryIsLiked(BatchQueryIsLikedReq) returns (BatchQueryIsLikedRes);
}

// FavoriteService 收藏与收藏列表
service FavoriteService {
  rpc Favorite(FavoriteReq) returns (google.protobuf.Empty);
  rpc RemoveFavorite(RemoveFavoriteReq) returns (google.protobuf.Empty);
  rpc QueryFavoriteInfo(QueryFavoriteInfoReq) returns (QueryFavoriteInfoRes);
  rpc QueryFavoriteList(QueryFavoriteListReq) returns (QueryFavoriteListRes);
}

// CommentService 评论增删查与缓存回填
service CommentService {
  rpc Comment(CommentReq) returns (CommentRes);
  rpc DeleteComment(DeleteCommentReq) returns (google.protobuf.Empty);
  rpc QueryCommentList(QueryCommentListReq) returns (QueryCommentListRes);
  rpc QueryReplyList(QueryReplyListReq) returns (QueryReplyListRes);
  rpc BatchGetComments(BatchGetCommentsReq) returns (BatchGetCommentsRes);
  rpc RefillCommentCache(RefillCommentCacheReq) returns (RefillCommentCacheRes);
}

// FollowService 关注关系与列表
service FollowService {
  rpc FollowUser(FollowUserReq) returns (FollowUserRes);
  rpc UnfollowUser(UnfollowUserReq) returns (UnfollowUserRes);
  rpc ListFollowees(ListFolloweesReq) returns (ListFolloweesRes);
  rpc ListFollowers(ListFollowersReq) returns (ListFollowersRes);
  rpc GetFollowSummary(GetFollowSummaryReq) returns (GetFollowSummaryRes);
}
