syntax = "proto3";

package ranfeed.count;

import "google/protobuf/empty.proto";

option go_package = "ran-feed/app/rpc/count/count";

// BizType 计数业务类型
enum BizType {
  BIZ_TYPE_UNSPECIFIED = 0;  // 未指定
  BIZ_TYPE_LIKE = 10;        // 点赞
  BIZ_TYPE_FAVORITE = 20;    // 收藏
  BIZ_TYPE_COMMENT = 30;     // 评论
  BIZ_TYPE_FOLLOWED = 40;    // 被关注
  BIZ_TYPE_FOLLOWING = 41;   // 关注
}

// TargetType 计数对象类型
enum TargetType {
  TARGET_TYPE_UNSPECIFIED = 0;  // 未指定
  TARGET_TYPE_CONTENT = 10;     // 内容
  TARGET_TYPE_USER = 20;        // 用户
}

// GetCountReq 查询单个计数
message GetCountReq {
  BizType biz_type = 1;
  TargetType target_type = 2;
  int64 target_id = 3;
}

// GetCountRes 查询结果
message GetCountRes {
  int64 value = 1;
}

// CountKey 计数唯一键
message CountKey {
  BizType biz_type = 1;
  TargetType target_type = 2;
  int64 target_id = 3;
}

// BatchGetCountReq 批量查询计数
message BatchGetCountReq {
  repeated CountKey keys = 1;
}

// CountValueItem 批量查询的单项返回
message CountValueItem {
  CountKey key = 1;
  int64 value = 2;
}

// BatchGetCountRes 批量查询结果
message BatchGetCountRes {
  repeated CountValueItem items = 1;
}

// IncReq 对计数 +1
message IncReq {
  BizType biz_type = 1;
  TargetType target_type = 2;
  int64 target_id = 3;
}

// DecReq 对计数 -1
message DecReq {
  BizType biz_type = 1;
  TargetType target_type = 2;
  int64 target_id = 3;
}

// GetUserProfileCountsReq 查询用户主页计数
message GetUserProfileCountsReq {
  int64 user_id = 1;
}

// GetUserProfileCountsRes 用户主页计数结果
message GetUserProfileCountsRes {
  int64 following_count = 1;
  int64 followed_count = 2;
  int64 like_count = 3;
  int64 favorite_count = 4;
}

// BatchGetContentCountsReq 按内容ID批量查询互动计数
message BatchGetContentCountsReq {
  repeated int64 content_ids = 1;
}

// ContentCountsItem 单个内容的互动计数
message ContentCountsItem {
  int64 content_id = 1;      // 内容ID
  int64 like_count = 2;      // 点赞数
  int64 favorite_count = 3;  // 收藏数
  int64 comment_count = 4;   // 评论数
}

// BatchGetContentCountsRes 批量查询结果 按入参 content_ids 去重后顺序返回
message BatchGetContentCountsRes {
  repeated ContentCountsItem items = 1;
}

service CounterService {
  rpc GetCount(GetCountReq) returns (GetCountRes);
  rpc BatchGetCount(BatchGetCountReq) returns (BatchGetCountRes);
  rpc Inc(IncReq) returns (google.protobuf.Empty);
  rpc Dec(DecReq) returns (google.protobuf.Empty);
  rpc GetUserProfileCounts(GetUserProfileCountsReq) returns (GetUserProfileCountsRes);
  rpc BatchGetContentCounts(BatchGetContentCountsReq) returns (BatchGetContentCountsRes);
}

